<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LightScript Remote</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{--bg0:#07080a;--bg1:#0c0e12;--bg2:#10131a;--bg3:#161b24;--bg4:#1c2230;--text0:#e8eaf0;--text1:#b0b8c8;--text2:#606880;--accent:#4a9eff;--accent2:#e0a030;--accent3:#50c878;--danger:#e05050;--border:#1e2535;--border2:#283040;--ui:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace}
html,body{height:100%;background:var(--bg0);color:var(--text0);font-family:var(--ui);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#auth-screen{position:fixed;inset:0;background:var(--bg0);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#auth-screen.hidden{display:none}
.auth-logo{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);letter-spacing:3px}
.auth-sub{font-family:var(--ui);font-size:11px;color:var(--text2);letter-spacing:2px;text-transform:uppercase}
.auth-keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.auth-keypad .kk{width:64px;height:64px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;font-size:18px;font-weight:700;color:var(--text0);cursor:pointer;display:flex;align-items:center;justify-content:center}
.auth-dots{display:flex;gap:10px;height:24px;align-items:center}
.auth-dot{width:12px;height:12px;border-radius:50%;background:var(--border2);transition:background .2s}
.auth-dot.filled{background:var(--accent)}
#auth-error{font-family:var(--mono);font-size:10px;color:var(--danger);height:16px;text-align:center}
#topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg1);border-bottom:1px solid var(--border);flex-shrink:0}
#topbar .show-name{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:700;letter-spacing:1px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-badge{font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:10px;border:1px solid var(--border2)}
.ws-badge.on{background:var(--accent3);color:#000;border-color:var(--accent3)}
.ws-badge.off{background:var(--bg3);color:var(--text2)}
.tb-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text1);font-family:var(--ui);font-weight:700;font-size:9px;letter-spacing:1px;padding:4px 10px;cursor:pointer;border-radius:3px;text-transform:uppercase}
.tb-btn.go{background:var(--accent2);border-color:var(--accent2);color:#000}
.tb-btn.danger{border-color:var(--danger);color:var(--danger)}
#tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab-btn{font-family:var(--ui);font-weight:700;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 11px;cursor:pointer;color:var(--text2);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tab-panel{display:none;flex:1;overflow-y:auto;flex-direction:column;gap:6px;padding:8px}
.tab-panel.active{display:flex}
#cmdbar{padding:4px 8px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:6px;align-items:center}
#cmd-display{flex:1;background:var(--bg3);border:1px solid var(--border2);color:var(--text0);font-family:var(--mono);font-size:13px;padding:7px 10px;border-radius:3px;min-height:36px;cursor:text;letter-spacing:1px;user-select:none}
#cmd-display.empty{color:var(--text2);font-size:10px;letter-spacing:0}
.cmd-send-btn{background:var(--accent);border:none;color:#000;font-weight:700;font-size:11px;letter-spacing:1px;padding:0 16px;height:36px;cursor:pointer;border-radius:3px;flex-shrink:0}
#keypad-panel{display:none;flex-direction:column;background:var(--bg1);border-top:1px solid var(--border);flex-shrink:0;padding:6px 8px;gap:4px}
#keypad-panel.open{display:flex}
.kp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.kp-btn{height:36px;background:var(--bg3);border:1px solid var(--border2);border-radius:3px;color:var(--text1);font-family:var(--mono);font-weight:700;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}
.kp-btn.kw{font-size:9px;letter-spacing:.5px;color:var(--accent);text-transform:uppercase}
.kp-btn.kaction{background:var(--bg2);color:var(--accent2);border-color:var(--accent2)}
.kp-btn.kgo{background:var(--accent3);color:#000;border-color:var(--accent3)}
.kp-btn.kdel{color:var(--danger)}
.kp-suggestions{display:flex;gap:4px;overflow-x:auto;padding:2px 0;min-height:28px}
.kp-sug{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;color:var(--accent);font-family:var(--mono);font-size:9px;padding:3px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.fix-grid{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
.fix-cell{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:5px 4px;cursor:pointer;text-align:center;user-select:none}
.fix-cell.sel{border-color:var(--accent);background:rgba(74,158,255,.1)}
.fix-cell.active{border-color:var(--accent3)}
.fix-num{font-family:var(--mono);font-size:9px;color:var(--text2)}
.fix-name{font-family:var(--ui);font-weight:700;font-size:9px;color:var(--text0);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fix-bar{height:3px;border-radius:1px;margin-top:3px}
.fix-swatch{height:7px;border-radius:2px;margin-top:2px}
.ml-section{margin-bottom:12px}
.ml-section-title{font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.ml-slider-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ml-slider-label{font-family:var(--mono);font-size:9px;color:var(--text2);min-width:34px}
.ml-slider{flex:1;height:5px;cursor:pointer;-webkit-appearance:none;appearance:none;border-radius:3px;outline:none;background:var(--bg4)}
.ml-val{font-family:var(--mono);font-size:9px;color:var(--text1);min-width:24px;text-align:right}
.xy-pad{width:140px;height:140px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;position:relative;cursor:crosshair;flex-shrink:0;touch-action:none;user-select:none}
.xy-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent2);border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none}
.gobo-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text1);font-family:var(--mono);font-size:9px;padding:5px 8px;cursor:pointer;border-radius:3px;min-width:36px;text-align:center}
.gobo-btn.active{background:var(--accent2);border-color:var(--accent2);color:#000}
.color-swatch-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.color-swatch{width:28px;height:28px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:border-color .1s}
.cue-row{background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:8px}
.cue-row.active{border-color:var(--accent2);background:rgba(224,160,48,.06)}
.cue-num{font-family:var(--mono);font-size:10px;color:var(--text2);min-width:28px}
.cue-name{font-family:var(--ui);font-weight:700;font-size:11px;color:var(--text0);flex:1}
.cue-fade{font-family:var(--mono);font-size:9px;color:var(--text2)}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:4px}
.preset-card{background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:8px 6px;cursor:pointer;text-align:center}
.preset-card:active{border-color:var(--accent)}
.ptype{font-family:var(--ui);font-size:8px;font-weight:700;letter-spacing:1px;color:var(--text2);text-transform:uppercase}
.pname{font-family:var(--mono);font-size:10px;color:var(--text0);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.faders-wrap{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 4px}
.fader-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px}
.fader-label{font-family:var(--ui);font-weight:700;font-size:8px;color:var(--text1);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fader-track{position:relative;width:36px;height:160px;background:var(--bg4);border-radius:5px;cursor:pointer;border:1px solid var(--border2);touch-action:none;user-select:none}
.fader-fill{position:absolute;bottom:0;left:2px;right:2px;border-radius:3px}
.fader-handle{position:absolute;left:50%;transform:translateX(-50%);width:32px;height:12px;background:var(--text1);border-radius:4px;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.fader-val{font-family:var(--mono);font-size:9px;color:var(--text2)}
.tl-card{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:10px;margin-bottom:6px}
.tl-card-name{font-family:var(--ui);font-weight:700;font-size:11px;margin-bottom:4px;display:flex;align-items:center;gap:6px;cursor:pointer}
.tl-running-badge{font-size:8px;letter-spacing:1px;padding:1px 6px;border-radius:10px;background:var(--accent3);color:#000}
.tl-progress-wrap{height:4px;background:var(--bg4);border-radius:2px;margin:6px 0;overflow:hidden}
.tl-progress-bar{height:100%;background:var(--accent3);border-radius:2px;transition:width .15s linear}
.tl-tc{font-family:var(--mono);font-size:10px;color:var(--text2)}
.tl-btns{display:flex;gap:4px;margin-top:6px}
.tl-cue-rows{margin-top:6px;border-top:1px solid var(--border);padding-top:6px}
.tl-cue-row{display:grid;grid-template-columns:90px 1fr;gap:6px;padding:3px 0;font-family:var(--mono);font-size:9px;color:var(--text2)}
.tl-cue-row.fired{color:var(--accent3)}
.btn{background:var(--bg4);border:1px solid var(--border2);color:var(--text1);font-family:var(--ui);font-weight:700;font-size:9px;letter-spacing:1px;padding:5px 10px;cursor:pointer;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.btn:active{opacity:.7}
.btn.sm{padding:3px 8px;font-size:8px}
.btn.green{background:var(--accent3);color:#000;border-color:var(--accent3)}
.btn.amber{background:var(--accent2);color:#000;border-color:var(--accent2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.section-title{font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin:6px 0 4px}
</style>
</head>
<body>
<div id="auth-screen">
  <div class="auth-logo">LIGHTSCRIPT</div>
  <div class="auth-sub">Remote — Enter Passcode</div>
  <div class="auth-dots" id="auth-dots"></div>
  <div class="auth-keypad">
    <div class="kk" onclick="authKey('1')">1</div><div class="kk" onclick="authKey('2')">2</div><div class="kk" onclick="authKey('3')">3</div>
    <div class="kk" onclick="authKey('4')">4</div><div class="kk" onclick="authKey('5')">5</div><div class="kk" onclick="authKey('6')">6</div>
    <div class="kk" onclick="authKey('7')">7</div><div class="kk" onclick="authKey('8')">8</div><div class="kk" onclick="authKey('9')">9</div>
    <div class="kk" onclick="authClear()" style="color:var(--danger)">⌫</div><div class="kk" onclick="authKey('0')">0</div>
    <div class="kk" onclick="authSend()" style="background:var(--accent3);color:#000">→</div>
  </div>
  <div id="auth-error"></div>
</div>
<div id="app">
  <div id="topbar">
    <span class="show-name" id="show-name">LightScript Remote</span>
    <span class="ws-badge off" id="ws-badge">OFFLINE</span>
    <button class="tb-btn danger" onclick="cmd('SET ALL dimmer 0')">⬛</button>
    <button class="tb-btn go" onclick="cmd('GO')">GO ▶</button>
  </div>
  <div id="tabs">
    <button class="tab-btn active" onclick="showTab('fixtures')">Fixtures</button>
    <button class="tab-btn" onclick="showTab('ml')">ML</button>
    <button class="tab-btn" onclick="showTab('cues')">Cues</button>
    <button class="tab-btn" onclick="showTab('presets')">Presets</button>
    <button class="tab-btn" onclick="showTab('faders')">Faders</button>
    <button class="tab-btn" onclick="showTab('timelines')">Timelines</button>
    <button class="tab-btn" onclick="showTab('cmd')">CMD</button>
  </div>
  <div id="content">
    <div class="tab-panel active" id="tab-fixtures">
      <div style="display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0">
        <button class="btn sm" onclick="cmd('SELECT ALL')">All</button>
        <button class="btn sm" onclick="selClear()">Clear</button>
        <button class="btn sm" onclick="cmd('SET SEL dimmer 255')">Full</button>
        <button class="btn sm" onclick="cmd('SET SEL dimmer 0')">Out</button>
      </div>
      <div id="fix-grid" class="fix-grid"></div>
    </div>
    <div class="tab-panel" id="tab-ml">
      <div id="ml-sel-label" style="font-family:var(--mono);font-size:10px;color:var(--accent2);padding:2px 0;flex-shrink:0">No selection</div>
      <div id="ml-wrap" style="display:flex;flex-direction:column;gap:2px"></div>
    </div>
    <div class="tab-panel" id="tab-cues">
      <div style="display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0">
        <button class="btn green" onclick="cmd('GO')">▶ GO</button>
        <button class="btn" onclick="cmd('BACK')">◀ BACK</button>
        <button class="btn danger" onclick="cmd('STOP')">■ STOP</button>
      </div>
      <div id="cue-list" style="display:flex;flex-direction:column;gap:4px"></div>
    </div>
    <div class="tab-panel" id="tab-presets">
      <div id="preset-filter" style="display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;margin-bottom:4px"></div>
      <div id="preset-grid" class="preset-grid"></div>
    </div>
    <div class="tab-panel" id="tab-faders">
      <div class="faders-wrap" id="faders-wrap"></div>
    </div>
    <div class="tab-panel" id="tab-timelines">
      <div style="display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0">
        <button class="btn sm green" onclick="tlCmdAll('PLAY')">▶ All</button>
        <button class="btn sm" onclick="tlCmdAll('STOP')">■ All</button>
        <button class="btn sm" onclick="tlCmdAll('RESET')">⏮ All</button>
      </div>
      <div id="tl-list" style="margin-top:6px"></div>
    </div>
    <div class="tab-panel" id="tab-cmd">
      <div class="section-title">Quick Actions</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="btn sm" onclick="cmd('SET SEL dimmer 255')">Full</button>
        <button class="btn sm" onclick="cmd('SET SEL dimmer 0')">Out</button>
        <button class="btn sm" onclick="cmd('FADE 2000 SEL dimmer 255')">Fade In</button>
        <button class="btn sm" onclick="cmd('FADE 2000 SEL dimmer 0')">Fade Out</button>
        <button class="btn sm green" onclick="cmd('GO')">GO</button>
        <button class="btn sm" onclick="cmd('BACK')">Back</button>
        <button class="btn sm danger" onclick="cmd('SET ALL dimmer 0')">Blackout</button>
        <button class="btn sm" onclick="selClear()">Clear Sel</button>
        <button class="btn sm" onclick="cmd('SELECT ALL')">Sel All</button>
      </div>
      <div class="section-title" style="margin-top:8px">Command History</div>
      <div id="log-area" style="background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:6px 8px;font-family:var(--mono);font-size:10px;color:var(--text2);max-height:200px;overflow-y:auto;flex:1"></div>
    </div>
  </div>
  <div id="cmdbar">
    <div id="cmd-display" class="empty" onclick="toggleKeypad()">Tap to type command…</div>
    <button class="cmd-send-btn" onclick="sendCmd()">↵</button>
  </div>
  <div id="keypad-panel">
    <div class="kp-suggestions" id="kp-suggestions"></div>
    <div class="kp-grid">
      <div class="kp-btn kw" onclick="kpWord('SET ')">SET</div>
      <div class="kp-btn kw" onclick="kpWord('FADE ')">FADE</div>
      <div class="kp-btn kw" onclick="kpWord('SEL ')">SEL</div>
      <div class="kp-btn kw" onclick="kpWord('ALL ')">ALL</div>
      <div class="kp-btn" onclick="kpChar('7')">7</div>
      <div class="kp-btn" onclick="kpChar('8')">8</div>
      <div class="kp-btn" onclick="kpChar('9')">9</div>
      <div class="kp-btn kw" onclick="kpWord('FIX ')">FIX</div>
      <div class="kp-btn" onclick="kpChar('4')">4</div>
      <div class="kp-btn" onclick="kpChar('5')">5</div>
      <div class="kp-btn" onclick="kpChar('6')">6</div>
      <div class="kp-btn kw" onclick="kpWord('dimmer ')">DIM</div>
      <div class="kp-btn" onclick="kpChar('1')">1</div>
      <div class="kp-btn" onclick="kpChar('2')">2</div>
      <div class="kp-btn" onclick="kpChar('3')">3</div>
      <div class="kp-btn kw" onclick="kpWord('STORE ')">STO</div>
      <div class="kp-btn kaction" onclick="kpWord('RECALL ')">RCL</div>
      <div class="kp-btn" onclick="kpChar('0')">0</div>
      <div class="kp-btn" onclick="kpChar(' ')">SPC</div>
      <div class="kp-btn kgo" onclick="sendCmd()">↵</div>
      <div class="kp-btn kw" onclick="kpWord('PRESET ')">PRE</div>
      <div class="kp-btn kw" onclick="kpWord('CUE ')">CUE</div>
      <div class="kp-btn" onclick="kpChar('.')">.</div>
      <div class="kp-btn kdel" onclick="kpDel()">⌫</div>
    </div>
  </div>
</div>
<script>
let ws=null,state={fixtures:[],cues:[],presets:[],faders:[],timelines:{},tlPlayers:{},showName:'',currentCue:-1};
let activeTab='fixtures',authed=false,reconnectTimer=null,cmdBuf='',keypadOpen=false;
const selected=new Set(),_tlExpanded=new Set();
let authBuf='';

// Auth
function authKey(k){authBuf+=k;renderAuthDots();if(authBuf.length>=8)authSend();}
function authClear(){authBuf=authBuf.slice(0,-1);renderAuthDots();}
function authSend(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'auth',passcode:authBuf}));authBuf='';renderAuthDots();}
function renderAuthDots(){const d=document.getElementById('auth-dots');if(!d)return;d.innerHTML='';for(let i=0;i<Math.max(4,authBuf.length);i++){const dot=document.createElement('div');dot.className='auth-dot'+(i<authBuf.length?' filled':'');d.appendChild(dot);}}

// WS
function connect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/ws');
  ws.onopen=()=>{setBadge(true);clearTimeout(reconnectTimer);};
  ws.onclose=()=>{setBadge(false);reconnectTimer=setTimeout(connect,2000);};
  ws.onerror=()=>{ws.close();};
  ws.onmessage=e=>{
    try{
      const msg=JSON.parse(e.data);
      if(msg.type==='auth_required'){showAuth(true);return;}
      if(msg.type==='auth_ok'){showAuth(false);return;}
      if(msg.type==='auth_fail'){document.getElementById('auth-error').textContent='Wrong passcode';return;}
      if(msg.type==='state'){
        state=msg;
        if(state.showName)document.getElementById('show-name').textContent=state.showName+' — Remote';
        renderCurrentTab();
        if(msg.log)addLog(msg.log.text,msg.log.type);
      }
    }catch(e){}
  };
}
function setBadge(on){const b=document.getElementById('ws-badge');b.textContent=on?'LIVE':'OFFLINE';b.className='ws-badge '+(on?'on':'off');}
function showAuth(show){document.getElementById('auth-screen').classList.toggle('hidden',!show);if(show)renderAuthDots();}
function cmd(c){if(ws&&ws.readyState===1)ws.send(JSON.stringify({cmd:c}));addLog('> '+c,'info');}

// Tabs
function showTab(name){
  activeTab=name;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+name+"'")));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const p=document.getElementById('tab-'+name);if(p)p.classList.add('active');
  renderCurrentTab();
}
function renderCurrentTab(){
  if(activeTab==='fixtures')renderFixtures();
  else if(activeTab==='ml')renderML();
  else if(activeTab==='cues')renderCues();
  else if(activeTab==='presets')renderPresets();
  else if(activeTab==='faders')renderFaders();
  else if(activeTab==='timelines')renderTimelines();
}

// Fixtures
function renderFixtures(){
  const grid=document.getElementById('fix-grid');if(!grid)return;
  grid.innerHTML='';
  (state.fixtures||[]).forEach(f=>{
    const isSel=selected.has(f.id),isActive=(f.dimmer||0)>5;
    const r=f.red??255,g=f.green??255,b=f.blue??255;
    const bright=Math.round((f.dimmer||0)/255*100);
    const d=document.createElement('div');d.className='fix-cell'+(isSel?' sel':'')+(isActive?' active':'');
    d.innerHTML=`<div class="fix-num">${f.id}</div><div class="fix-name">${esc(f.name||'Fix '+f.id)}</div><div class="fix-bar" style="width:${bright}%;background:${isActive?'var(--accent3)':'var(--border2)'}"></div><div class="fix-swatch" style="background:rgb(${Math.round(r*f.dimmer/255)},${Math.round(g*f.dimmer/255)},${Math.round(b*f.dimmer/255)})"></div>`;
    d.onclick=()=>toggleFix(f.id);grid.appendChild(d);
  });
}
function toggleFix(id){if(selected.has(id))selected.delete(id);else selected.add(id);renderFixtures();if(selected.size)cmd('SELECT FIX '+[...selected].join(','));if(activeTab==='ml')renderML();}
function selClear(){selected.clear();renderFixtures();if(activeTab==='ml')renderML();}

// ML Controls
function renderML(){
  const wrap=document.getElementById('ml-wrap'),label=document.getElementById('ml-sel-label');
  if(!wrap)return;
  const ids=[...selected];
  if(label)label.textContent=ids.length?`${ids.length} fixture${ids.length>1?'s':''} selected`:'No selection — tap a fixture first';
  wrap.innerHTML='';if(!ids.length)return;
  const f=state.fixtures.find(x=>ids.includes(x.id));if(!f)return;

  // Intensity
  wrap.appendChild(mkSection('Intensity',[mkSliderEl('Dim','dimmer',f.dimmer??0,'#50c878')]));

  // Color
  const colSec=document.createElement('div');colSec.className='ml-section';
  const hexColor='#'+[f.red??255,f.green??255,f.blue??255].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  const pickerDiv=document.createElement('div');pickerDiv.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:8px';
  const picker=document.createElement('input');picker.type='color';picker.value=hexColor;
  picker.style.cssText='width:52px;height:52px;border:none;background:none;cursor:pointer;padding:0;border-radius:6px;flex-shrink:0';
  let pickerTimer=null;
  picker.addEventListener('input',()=>{
    const c=picker.value;
    clearTimeout(pickerTimer);
    pickerTimer=setTimeout(()=>{cmd(`SET SEL red ${parseInt(c.slice(1,3),16)}`);cmd(`SET SEL green ${parseInt(c.slice(3,5),16)}`);cmd(`SET SEL blue ${parseInt(c.slice(5,7),16)}`);},50);
  });
  const swatchWrap=document.createElement('div');swatchWrap.className='color-swatch-row';
  ['#ff0000','#ff8000','#ffff00','#00ff00','#00ffaa','#0088ff','#8800ff','#ff0088','#ffffff','#ffddaa','#aaddff','#222222'].forEach(c=>{
    const sw=document.createElement('div');sw.className='color-swatch';sw.style.background=c;
    sw.onclick=()=>{cmd(`SET SEL red ${parseInt(c.slice(1,3),16)}`);cmd(`SET SEL green ${parseInt(c.slice(3,5),16)}`);cmd(`SET SEL blue ${parseInt(c.slice(5,7),16)}`);};
    swatchWrap.appendChild(sw);
  });
  pickerDiv.appendChild(picker);pickerDiv.appendChild(swatchWrap);
  colSec.innerHTML='<div class="ml-section-title">Color</div>';
  colSec.appendChild(pickerDiv);
  [['R','red',f.red??255,'#e05050'],['G','green',f.green??255,'#50c878'],['B','blue',f.blue??255,'#4a9eff']].forEach(([l,p,v,c])=>colSec.appendChild(mkSliderEl(l,p,v,c)));
  if(f.white!=null)colSec.appendChild(mkSliderEl('W','white',f.white,'#c8c8c8'));
  if(f.amber!=null)colSec.appendChild(mkSliderEl('A','amber',f.amber,'#e0a030'));
  if(f.uv!=null)colSec.appendChild(mkSliderEl('UV','uv',f.uv,'#8040ff'));
  wrap.appendChild(colSec);

  // Pan/Tilt
  if(f.pan!=null&&f.tilt!=null){
    const ptSec=document.createElement('div');ptSec.className='ml-section';
    ptSec.innerHTML='<div class="ml-section-title">Pan / Tilt</div>';
    const ptRow=document.createElement('div');ptRow.style.cssText='display:flex;gap:10px;align-items:flex-start';
    const pad=document.createElement('div');pad.className='xy-pad';
    const dot=document.createElement('div');dot.className='xy-dot';dot.id='xy-dot-'+f.id;
    const ch=document.createElement('div');ch.style.cssText='position:absolute;top:50%;left:0;width:100%;height:1px;background:rgba(255,255,255,0.07);transform:translateY(-50%)';
    const cv=document.createElement('div');cv.style.cssText='position:absolute;top:0;left:50%;width:1px;height:100%;background:rgba(255,255,255,0.07);transform:translateX(-50%)';
    pad.appendChild(ch);pad.appendChild(cv);pad.appendChild(dot);
    dot.style.left=(((f.pan??127)/255)*100)+'%';dot.style.top=(((f.tilt??127)/255)*100)+'%';
    let ptDrag=false;
    const applyXY=e=>{
      const rect=pad.getBoundingClientRect();const pt=e.touches?e.touches[0]:e;
      const pv=Math.max(0,Math.min(255,Math.round((pt.clientX-rect.left)/rect.width*255)));
      const tv=Math.max(0,Math.min(255,Math.round((pt.clientY-rect.top)/rect.height*255)));
      cmd(`SET SEL pan ${pv}`);cmd(`SET SEL tilt ${tv}`);
      dot.style.left=(pv/255*100)+'%';dot.style.top=(tv/255*100)+'%';
    };
    pad.addEventListener('pointerdown',e=>{ptDrag=true;pad.setPointerCapture(e.pointerId);applyXY(e);e.preventDefault();},{passive:false});
    pad.addEventListener('pointermove',e=>{if(ptDrag)applyXY(e);},{passive:false});
    pad.addEventListener('pointerup',()=>ptDrag=false);
    const slCol=document.createElement('div');slCol.style.cssText='display:flex;flex-direction:column;gap:6px;flex:1';
    slCol.appendChild(mkSliderEl('Pan','pan',f.pan??127,'var(--accent)'));
    slCol.appendChild(mkSliderEl('Tilt','tilt',f.tilt??127,'var(--accent)'));
    ptRow.appendChild(pad);ptRow.appendChild(slCol);
    ptSec.appendChild(ptRow);wrap.appendChild(ptSec);
  }

  // Gobo
  if(f.gobo!=null){
    const gobos=state.gdtfGobos?.[f.profileId]||[{name:'Open',val:0},{name:'1',val:30},{name:'2',val:60},{name:'3',val:90},{name:'4',val:120},{name:'5',val:150},{name:'6',val:180},{name:'7',val:210},{name:'Spin',val:240}];
    const gSec=document.createElement('div');gSec.className='ml-section';
    gSec.innerHTML='<div class="ml-section-title">Gobo</div>';
    const gRow=document.createElement('div');gRow.style.cssText='display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px';
    gobos.forEach(g=>{
      const b=document.createElement('button');b.className='gobo-btn'+(Math.abs((f.gobo??0)-g.val)<15?' active':'');
      b.textContent=g.name;b.onclick=()=>cmd(`SET SEL gobo ${g.val}`);
      gRow.appendChild(b);
    });
    gSec.appendChild(gRow);gSec.appendChild(mkSliderEl('Gobo','gobo',f.gobo??0,'var(--accent2)'));
    wrap.appendChild(gSec);
  }

  // Other
  const others=[['Zoom','zoom'],['Focus','focus'],['Shutter','shutter'],['Strobe','strobe'],['Speed','speed'],['Iris','iris']];
  const otherEls=others.filter(([,p])=>f[p]!=null).map(([l,p])=>mkSliderEl(l,p,f[p],'var(--accent)'));
  if(otherEls.length)wrap.appendChild(mkSection('Other',otherEls));
}

function mkSection(title,children){const d=document.createElement('div');d.className='ml-section';d.innerHTML=`<div class="ml-section-title">${title}</div>`;children.forEach(c=>d.appendChild(c));return d;}
function mkSliderEl(label,param,val,color){
  const d=document.createElement('div');d.className='ml-slider-row';
  const sl=document.createElement('input');sl.type='range';sl.min=0;sl.max=255;sl.value=Math.round(val);sl.className='ml-slider';sl.style.accentColor=color;
  const vl=document.createElement('span');vl.className='ml-val';vl.textContent=Math.round(val);
  let t=null;
  sl.addEventListener('input',()=>{vl.textContent=sl.value;clearTimeout(t);t=setTimeout(()=>cmd(`SET SEL ${param} ${sl.value}`),20);});
  d.innerHTML=`<span class="ml-slider-label">${label}</span>`;d.appendChild(sl);d.appendChild(vl);return d;
}

// Cues
function renderCues(){
  const list=document.getElementById('cue-list');if(!list)return;list.innerHTML='';
  (state.cues||[]).forEach((c,i)=>{
    const isActive=state.currentCue===i;
    const row=document.createElement('div');row.className='cue-row'+(isActive?' active':'');
    row.innerHTML=`<span class="cue-num">${c.num}</span><span class="cue-name">${esc(c.name||'Cue '+c.num)}</span><span class="cue-fade">${c.fade>0?(c.fade/1000).toFixed(1)+'s':''}</span><button class="btn sm amber" onclick="cmd('JUMP CUE ${i}')">GO</button>`;
    list.appendChild(row);
  });
}

// Presets
let presetFilter='ALL';
function renderPresets(){
  const types=['ALL',...new Set((state.presets||[]).map(p=>p.type))];
  const fbar=document.getElementById('preset-filter');if(!fbar)return;fbar.innerHTML='';
  types.forEach(t=>{const b=document.createElement('button');b.className='btn sm'+(presetFilter===t?' amber':'');b.textContent=t;b.onclick=()=>{presetFilter=t;renderPresets();};fbar.appendChild(b);});
  const grid=document.getElementById('preset-grid');if(!grid)return;grid.innerHTML='';
  (state.presets||[]).filter(p=>presetFilter==='ALL'||p.type===presetFilter).forEach(p=>{
    const card=document.createElement('div');card.className='preset-card';
    card.innerHTML=`<div class="ptype">${p.type}</div><div class="pname">${esc(p.name||p.num)}</div>`;
    card.onclick=()=>cmd(`RECALL PRESET ${p.type}.${p.num}`);
    grid.appendChild(card);
  });
}

// Faders — pointer-capture drag
function renderFaders(){
  const wrap=document.getElementById('faders-wrap');if(!wrap)return;wrap.innerHTML='';
  (state.faders||[]).forEach((f,i)=>{
    const pct=Math.round((f.val||0)/255*100);
    const col=document.createElement('div');col.className='fader-col';
    col.innerHTML=`<div class="fader-label" title="${esc(f.name||'F'+(i+1))}">${esc(f.name||'F'+(i+1))}</div>
      <div class="fader-track" id="ft${i}">
        <div class="fader-fill" id="ff${i}" style="height:${pct}%;background:var(--accent)"></div>
        <div class="fader-handle" id="fh${i}" style="bottom:calc(${pct}% - 6px)"></div>
      </div>
      <div class="fader-val" id="fv${i}">${pct}%</div>`;
    wrap.appendChild(col);
    requestAnimationFrame(()=>{
      const track=document.getElementById('ft'+i);if(!track)return;
      let drag=false,sendT=null;
      const upd=e=>{
        const rect=track.getBoundingClientRect();const p=e.touches?e.touches[0]:e;
        const pct2=Math.max(0,Math.min(100,Math.round((1-(p.clientY-rect.top)/rect.height)*100)));
        const val=Math.round(pct2/100*255);
        const ff=document.getElementById('ff'+i),fh=document.getElementById('fh'+i),fvv=document.getElementById('fv'+i);
        if(ff)ff.style.height=pct2+'%';if(fh)fh.style.bottom=`calc(${pct2}% - 6px)`;if(fvv)fvv.textContent=pct2+'%';
        clearTimeout(sendT);sendT=setTimeout(()=>cmd(`FADER ${i+1} ${val}`),40);
      };
      track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);upd(e);e.preventDefault();},{passive:false});
      track.addEventListener('pointermove',e=>{if(drag)upd(e);},{passive:false});
      track.addEventListener('pointerup',()=>drag=false);
      track.addEventListener('pointercancel',()=>drag=false);
    });
  });
}

// Timelines
function formatTC(ms){ms=Math.max(0,ms||0);const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms%1000).padStart(3,'0')}`;}

function renderTimelines(){
  const list=document.getElementById('tl-list');if(!list)return;list.innerHTML='';
  const tls=state.timelines||{},players=state.tlPlayers||{};
  if(!Object.keys(tls).length){list.innerHTML='<div style="color:var(--text2);font-size:11px;padding:16px;text-align:center">No timelines stored</div>';return;}
  Object.entries(tls).forEach(([name,tl])=>{
    const p=players[name]||{running:false,offsetMs:0};
    const dur=tl.steps?.length?Math.max(...tl.steps.map(s=>s.timeMs||0)):0;
    const elapsed=p.offsetMs||0;
    const pct=dur>0?Math.min(elapsed/dur*100,100):0;
    const expanded=_tlExpanded.has(name);
    const card=document.createElement('div');card.className='tl-card';
    let cueHTML='';
    if(expanded&&tl.steps?.length){
      cueHTML='<div class="tl-cue-rows">'+tl.steps.map(s=>{
        const fired=p.running&&s.timeMs<=elapsed;
        return`<div class="tl-cue-row${fired?' fired':''}"><span>${formatTC(s.timeMs)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.cmd||'')}</span></div>`;
      }).join('')+'</div>';
    }
    card.innerHTML=`<div class="tl-card-name" onclick="tlToggleExpand('${escA(name)}')">
        <span style="flex:1">${esc(name)} ${expanded?'▼':'▶'}</span>
        ${p.running?'<span class="tl-running-badge">RUNNING</span>':''}
        ${tl.looping?'<span style="font-size:8px;color:var(--accent2);border:1px solid var(--accent2);padding:1px 5px;border-radius:10px">LOOP</span>':''}
      </div>
      <div class="tl-tc">${formatTC(elapsed)} / ${formatTC(dur)}</div>
      <div class="tl-progress-wrap"><div class="tl-progress-bar" style="width:${pct}%"></div></div>
      <div class="tl-btns">
        <button class="btn sm green" onclick="cmd('TIMELINE PLAY ${escA(name)}')">▶</button>
        <button class="btn sm" onclick="cmd('TIMELINE PAUSE ${escA(name)}')">⏸</button>
        <button class="btn sm" onclick="cmd('TIMELINE STOP ${escA(name)}')">■</button>
        <button class="btn sm" onclick="cmd('TIMELINE RESET ${escA(name)}')">⏮</button>
      </div>${cueHTML}`;
    list.appendChild(card);
  });
}
function tlToggleExpand(name){if(_tlExpanded.has(name))_tlExpanded.delete(name);else _tlExpanded.add(name);renderTimelines();}
function tlCmdAll(action){Object.keys(state.timelines||{}).forEach(name=>cmd(`TIMELINE ${action} ${name}`));}

// Keypad
const KP_SUBS=['SET FIX ','SET SEL ','FADE ','STORE CUE ','RECALL PRESET ','SELECT ALL','GO','BACK','SELECT FIX '];
function toggleKeypad(){keypadOpen=!keypadOpen;document.getElementById('keypad-panel').classList.toggle('open',keypadOpen);if(keypadOpen)updateSuggestions();}
function kpChar(c){cmdBuf+=c;updateCmdDisplay();updateSuggestions();}
function kpWord(w){cmdBuf+=w;updateCmdDisplay();updateSuggestions();}
function kpDel(){cmdBuf=cmdBuf.slice(0,-1);updateCmdDisplay();updateSuggestions();}
function updateCmdDisplay(){const d=document.getElementById('cmd-display');if(cmdBuf){d.textContent=cmdBuf;d.classList.remove('empty');}else{d.textContent='Tap to type command…';d.classList.add('empty');}}
function updateSuggestions(){const area=document.getElementById('kp-suggestions');if(!area)return;area.innerHTML='';const up=cmdBuf.toUpperCase();const sug=KP_SUBS.filter(s=>!up||s.toUpperCase().startsWith(up)||s.toUpperCase().includes(up)).slice(0,8);sug.forEach(s=>{const b=document.createElement('div');b.className='kp-sug';b.textContent=s.trim();b.onclick=()=>{cmdBuf=s;updateCmdDisplay();updateSuggestions();};area.appendChild(b);});}
function sendCmd(){const v=cmdBuf.trim();if(!v)return;cmd(v);cmdBuf='';updateCmdDisplay();if(keypadOpen)updateSuggestions();}

// Log
function addLog(text,type='info'){const a=document.getElementById('log-area');if(!a)return;const line=document.createElement('div');line.style.cssText=`margin-bottom:1px;color:${type==='ok'?'var(--accent3)':type==='err'?'var(--danger)':'var(--text2)'}`;line.textContent=text;a.appendChild(line);if(a.children.length>100)a.removeChild(a.firstChild);a.scrollTop=a.scrollHeight;}

// Utils
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escA(s){return String(s).replace(/'/g,"\\'");}

// Boot — auth screen hidden by default; server sends auth_required if passcode is set
showAuth(false);
connect();
</script>
