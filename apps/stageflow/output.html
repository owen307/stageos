<!DOCTYPE html><html><head><meta charset="UTF-8"><title>StageFlow Output</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;width:100vw;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
#slide{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .3s}
#slide-text{color:#fff;font-size:5vw;font-weight:700;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.8);padding:40px;font-family:system-ui}
#slide-sub{color:rgba(255,255,255,.7);font-size:2.5vw;text-align:center;margin-top:16px;font-family:system-ui}</style></head><body>
<div id="slide"><span id="slide-text"></span><span id="slide-sub"></span></div>
<script>
window.sf?.onShow(slide=>{
  document.getElementById('slide').style.opacity='0';
  setTimeout(()=>{
    document.getElementById('slide-text').textContent=slide.text||'';
    document.getElementById('slide-sub').textContent=slide.sub||'';
    document.body.style.background=slide.bg||'#000';
    document.getElementById('slide-text').style.color=slide.textColor||'#fff';
    document.getElementById('slide').style.opacity='1';
  },200);
});
window.sf?.onBlackout(()=>{ document.getElementById('slide').style.opacity='0'; document.body.style.background='#000'; });
window.sf?.onClear(()=>{ document.getElementById('slide-text').textContent=''; document.getElementById('slide-sub').textContent=''; });
</script>
</body></html>
