<!DOCTYPE html><html><head><meta charset="UTF-8"><title>StageFlow — Operator</title>
<style>:root{--bg:#0a0b0e;--surf:#111318;--surf2:#181b22;--border:#1e2530;--amber:#e8a020;--green:#22c55e;--red:#ef4444;--text:#f0f2f7;--muted:#6b7280}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:system-ui;height:100vh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:46px;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0}.logo{font-weight:800;font-size:15px;color:var(--amber)}.live-badge{padding:4px 10px;background:rgba(239,68,68,.2);border:1px solid var(--red);border-radius:4px;font-size:10px;font-weight:700;color:var(--red)}.layout{flex:1;display:flex;overflow:hidden}.sidebar{width:220px;background:var(--surf);border-right:1px solid var(--border);overflow-y:auto;padding:10px}.pl-item{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;margin-bottom:4px;transition:background .15s}.pl-item:hover{background:var(--surf2)}.pl-item.active{background:var(--surf2);border-left:3px solid var(--amber)}.center{flex:1;display:flex;flex-direction:column;overflow:hidden}.monitors{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--border)}.monitor{flex:1;aspect-ratio:16/9;background:#000;border-radius:6px;border:1px solid var(--border);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.monitor-lbl{position:absolute;top:6px;left:8px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase}.monitor.live{border-color:var(--red)}.monitor.pvw{border-color:var(--green)}.slide-grid{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.slide-card{background:var(--surf2);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;transition:all .15s;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative;font-size:11px;text-align:center;padding:8px}.slide-card:hover{border-color:var(--amber)}.slide-card.selected{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}.slide-card.live{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}.controls{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}.btn{padding:8px 18px;border-radius:6px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:system-ui}.ba{background:var(--amber);color:#000}.br{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.3);color:var(--red)}.bs{background:var(--surf2);border:1px solid var(--border);color:var(--muted)}</style></head><body>
<header><div class="logo">📽 StageFlow</div><div style="display:flex;align-items:center;gap:10px"><span id="live-text" style="font-size:11px;color:var(--muted)">Nothing live</span><div class="live-badge">OUTPUT ACTIVE</div></div></header>
<div class="layout">
  <div class="sidebar" id="playlist-sidebar">
    <div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Playlists</div>
  </div>
  <div class="center">
    <div class="monitors">
      <div class="monitor live" id="mon-live"><div class="monitor-lbl">LIVE</div><span id="mon-live-text" style="color:var(--muted);font-size:10px">CLEAR</span></div>
      <div class="monitor pvw" id="mon-pvw"><div class="monitor-lbl">PREVIEW</div><span id="mon-pvw-text" style="color:var(--muted);font-size:10px">—</span></div>
    </div>
    <div class="slide-grid" id="slide-grid"></div>
    <div class="controls">
      <button class="btn bs" onclick="prevSlide()">◀ Prev</button>
      <button class="btn ba" style="font-size:14px;font-weight:900;padding:10px 28px" onclick="goLive()">GO LIVE</button>
      <button class="btn bs" onclick="nextSlide()">Next ▶</button>
      <div style="flex:1"></div>
      <button class="btn br" onclick="blackout()">⚫ Blackout</button>
      <button class="btn bs" onclick="clearOutput()">Clear</button>
    </div>
  </div>
</div>
<script>
const playlists = [
  { name:'Morning Service', slides:['Welcome','Announcements','Song: Great Is Thy Faithfulness','Song: How Great Thou Art','Scripture: John 3:16','Message Title','Point 1','Point 2','Point 3','Communion','Offering','Closing Song','Dismissal'] },
  { name:'Evening Service', slides:['Welcome Back','Song: Amazing Grace','Prayer','Scripture Reading','Sermon Notes','Closing'] },
  { name:'Worship Set', slides:['How Great Is Our God','10,000 Reasons','What A Beautiful Name','Oceans','Build My Life','Closing Worship'] },
  { name:'Lower Thirds', slides:['Pastor John Smith','Guest Speaker','Scripture Reference','Announcements','Website URL'] }
];

let curPL=0, selSlide=0, liveSlide=-1;

function renderPlaylists(){
  const sb=document.getElementById('playlist-sidebar');
  sb.innerHTML='<div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Playlists</div>';
  playlists.forEach((pl,i)=>{
    const el=document.createElement('div'); el.className='pl-item'+(i===curPL?' active':'');
    el.textContent=pl.name; el.onclick=()=>{curPL=i;selSlide=0;liveSlide=-1;renderPlaylists();renderSlides();};
    sb.appendChild(el);
  });
}

function renderSlides(){
  const grid=document.getElementById('slide-grid');
  const slides=playlists[curPL].slides;
  grid.innerHTML=slides.map((s,i)=>`
    <div class="slide-card${i===selSlide?' selected':''}${i===liveSlide?' live':''}"
      onclick="selectSlide(${i})" ondblclick="goLive()">
      <span>${s}</span>
    </div>`).join('');
}

function selectSlide(i){ selSlide=i; renderSlides(); document.getElementById('mon-pvw-text').textContent=playlists[curPL].slides[i]; }
function goLive(){
  if(selSlide<0)return;
  liveSlide=selSlide;
  const slide={text:playlists[curPL].slides[selSlide],bg:'#000',textColor:'#fff'};
  window.sf?.goLive(slide);
  document.getElementById('mon-live-text').textContent=slide.text;
  document.getElementById('live-text').textContent='Live: '+slide.text;
  renderSlides();
}
function prevSlide(){ if(selSlide>0){selSlide--;renderSlides();} }
function nextSlide(){ if(selSlide<playlists[curPL].slides.length-1){selSlide++;renderSlides();} }
function blackout(){ window.sf?.blackout(); document.getElementById('mon-live-text').textContent='BLACKOUT'; }
function clearOutput(){ window.sf?.clear(); document.getElementById('mon-live-text').textContent='CLEAR'; liveSlide=-1; renderSlides(); }

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){nextSlide();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){prevSlide();}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();goLive();}
  else if(e.key==='Escape'){clearOutput();}
});

renderPlaylists(); renderSlides();
</script>
</body></html>
