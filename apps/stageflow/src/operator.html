<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StageFlow Operator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg0: #0f1117;
    --bg1: #161820;
    --bg2: #1e2130;
    --bg3: #252840;
    --bg4: #2e3250;
    --accent: #5b8dee;
    --accent2: #8b5cf6;
    --green: #22d3a0;
    --red: #f87171;
    --amber: #fbbf24;
    --text0: #f0f2ff;
    --text1: #a8b0d0;
    --text2: #5c6280;
    --border: #2a2e48;
    --live: #22c55e;
  }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg0); color:var(--text0); font-family:'Segoe UI',system-ui,sans-serif; font-size:13px; }

  /* ── Layout ── */
  #app { display:grid; grid-template-rows:44px 1fr; height:100vh; }
  #main { display:grid; grid-template-columns:200px 1fr 300px; overflow:hidden; }

  /* ── Topbar ── */
  #topbar { background:var(--bg1); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:10px; }
  .logo { font-size:15px; font-weight:700; letter-spacing:.05em; }
  .logo span { color:var(--accent); }
  .sep { flex:1; }
  .live-badge { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text2); }
  .live-badge.active { color:var(--live); }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--text2); }
  .live-badge.active .live-dot { background:var(--live); box-shadow:0 0 6px var(--live); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .tbtn { background:var(--bg2); border:1px solid var(--border); color:var(--text1); border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12px; transition:all .15s; }
  .tbtn:hover { background:var(--bg3); color:var(--text0); }
  .tbtn.danger { color:var(--red); border-color:#3a1f1f; }
  .tbtn.danger:hover { background:#2a1515; }
  .tbtn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tbtn.primary:hover { background:#4a7ee0; }

  /* ── Playlist Sidebar ── */
  #sidebar { background:var(--bg1); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .panel-hdr { padding:10px 12px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text2); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .icon-btn { background:none; border:none; color:var(--text2); cursor:pointer; font-size:18px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:4px; transition:all .12s; line-height:1; }
  .icon-btn:hover { color:var(--text0); background:var(--bg3); }

  #playlist-list { flex:1; overflow-y:auto; padding:6px; }
  #playlist-list::-webkit-scrollbar { width:3px; }
  #playlist-list::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:2px; }

  .pl-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px; cursor:pointer; border:1px solid transparent; transition:all .12s; margin-bottom:2px; }
  .pl-item:hover { background:var(--bg2); }
  .pl-item.active { background:var(--bg3); border-color:var(--accent); }
  .pl-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .pl-info { flex:1; min-width:0; }
  .pl-name { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-count { font-size:10px; color:var(--text2); margin-top:1px; }
  .pl-live-pip { width:6px; height:6px; border-radius:50%; background:var(--live); flex-shrink:0; display:none; }
  .pl-item.has-live .pl-live-pip { display:block; }

  /* ── Main Slide Grid ── */
  #slide-area { display:flex; flex-direction:column; overflow:hidden; background:var(--bg0); }
  #slide-area-header { padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg1); display:flex; align-items:center; gap:10px; flex-shrink:0; }
  #active-playlist-name { font-size:13px; font-weight:600; color:var(--text0); }
  #active-playlist-sub { font-size:11px; color:var(--text2); }
  .hdr-sep { flex:1; }
  #add-slide-btn { background:var(--bg2); border:1px solid var(--border); color:var(--text1); border-radius:5px; padding:4px 10px; font-size:11px; cursor:pointer; transition:all .12s; }
  #add-slide-btn:hover { background:var(--bg3); color:var(--text0); }

  #slide-grid { flex:1; overflow-y:auto; padding:14px; display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; align-content:start; }
  #slide-grid::-webkit-scrollbar { width:4px; }
  #slide-grid::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:2px; }

  .slide-card { border-radius:8px; border:2px solid var(--border); overflow:hidden; cursor:pointer; transition:all .12s; background:var(--bg1); }
  .slide-card:hover { border-color:var(--text2); transform:translateY(-1px); }
  .slide-card.selected { border-color:var(--accent); }
  .slide-card.live { border-color:var(--live); box-shadow:0 0 0 1px var(--live); }
  .slide-card-screen { width:100%; aspect-ratio:16/9; background:#000; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .slide-card-footer { padding:5px 8px; display:flex; align-items:center; gap:6px; background:var(--bg2); }
  .slide-card-num { font-size:10px; color:var(--text2); flex-shrink:0; }
  .slide-card-label { font-size:11px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .slide-card.live .slide-card-footer { background:#0d2a1a; }
  .live-tag { font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--live); flex-shrink:0; }

  #empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text2); gap:10px; }
  #empty-state .big { font-size:32px; }
  #empty-state p { font-size:13px; }

  /* ── Right Panel ── */
  #rightpanel { background:var(--bg1); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }

  /* Preview monitors */
  #monitors { padding:12px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid var(--border); }
  .monitor-box { display:flex; flex-direction:column; gap:4px; }
  .monitor-label { font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; display:flex; align-items:center; gap:5px; }
  .monitor-label.lbl-live { color:var(--live); }
  .monitor-label.lbl-next { color:var(--accent); }
  .monitor-screen { width:100%; aspect-ratio:16/9; border-radius:6px; border:1px solid var(--border); background:#000; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .monitor-screen.live-border { border-color:var(--live); }
  .slide-canvas { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:7%; }
  .slide-text { text-align:center; line-height:1.25; font-weight:600; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.8); width:100%; word-break:break-word; }

  /* Go / Clear */
  #go-btn { margin:10px 12px 4px; padding:10px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-size:14px; font-weight:700; letter-spacing:.06em; cursor:pointer; transition:all .15s; text-transform:uppercase; }
  #go-btn:hover { background:#4a7ee0; transform:translateY(-1px); }
  #go-btn:active { transform:translateY(0); }
  #clear-btn { margin:0 12px 10px; padding:7px; background:transparent; border:1px solid var(--border); border-radius:7px; color:var(--text1); font-size:12px; cursor:pointer; transition:all .15s; }
  #clear-btn:hover { border-color:var(--red); color:var(--red); }

  /* Tabs */
  .rtabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
  .rtab { flex:1; padding:8px 4px; text-align:center; font-size:11px; font-weight:500; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; transition:all .12s; }
  .rtab:hover { color:var(--text0); }
  .rtab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab-body { display:none; flex:1; overflow-y:auto; }
  .tab-body.active { display:block; }
  .tab-body::-webkit-scrollbar { width:3px; }
  .tab-body::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:2px; }

  /* Props */
  #props-area { padding:10px; display:flex; flex-direction:column; gap:8px; }
  label { font-size:11px; color:var(--text2); display:block; margin-bottom:3px; }
  input[type=text], textarea, select { width:100%; background:var(--bg0); border:1px solid var(--border); border-radius:5px; color:var(--text0); font-size:12px; padding:6px 8px; outline:none; font-family:inherit; transition:border-color .15s; }
  input[type=text]:focus, textarea:focus, select:focus { border-color:var(--accent); }
  textarea { resize:vertical; min-height:72px; line-height:1.5; }
  select option { background:var(--bg1); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .range-row { display:flex; align-items:center; gap:8px; }
  .range-val { font-size:11px; color:var(--text1); min-width:32px; text-align:right; }
  .prop-group { background:var(--bg0); border:1px solid var(--border); border-radius:6px; padding:9px 10px 11px; }
  .prop-group-title { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text2); margin-bottom:7px; }
  .color-row { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  .color-swatch { width:20px; height:20px; border-radius:4px; cursor:pointer; border:2px solid transparent; transition:all .12s; }
  .color-swatch:hover, .color-swatch.active { border-color:#fff; transform:scale(1.15); }

  /* Themes */
  .theme-list { padding:8px 10px; display:flex; flex-direction:column; gap:5px; }
  .theme-item { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:6px; border:1px solid var(--border); cursor:pointer; transition:all .12s; }
  .theme-item:hover { background:var(--bg2); }
  .theme-item.active { background:var(--bg3); border-color:var(--accent); }
  .theme-swatch { width:32px; height:18px; border-radius:3px; flex-shrink:0; }
  .theme-name { font-size:11px; font-weight:500; }

  /* Output tab */
  .out-section { padding:10px 12px; border-bottom:1px solid var(--border); }
  .out-section label { margin-bottom:5px; }
  .disp-btn { width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:5px; color:var(--text1); padding:6px 10px; font-size:11px; cursor:pointer; text-align:left; transition:all .15s; margin-bottom:4px; }
  .disp-btn:hover { background:var(--bg3); color:var(--text0); }
  .disp-btn.selected { background:var(--bg4); border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<div id="app">

  <!-- Topbar -->
  <div id="topbar">
    <div class="logo">Stage<span>Flow</span></div>
    <div class="sep"></div>
    <div class="live-badge" id="live-badge">
      <div class="live-dot"></div>
      <span id="live-status">OUTPUT OFF</span>
    </div>
    <button class="tbtn primary" id="launch-btn" onclick="launchOutput()">⬛ Launch Output</button>
    <button class="tbtn danger" id="stop-btn" onclick="stopOutput()" style="display:none">✕ Stop Output</button>
  </div>

  <!-- Main 3-column -->
  <div id="main">

    <!-- LEFT: Playlist Sidebar -->
    <div id="sidebar">
      <div class="panel-hdr">
        Playlists
        <button class="icon-btn" onclick="addPlaylist()" title="New playlist">+</button>
      </div>
      <div id="playlist-list"></div>
    </div>

    <!-- CENTER: Slide Grid -->
    <div id="slide-area">
      <div id="slide-area-header">
        <div>
          <div id="active-playlist-name">No playlist selected</div>
          <div id="active-playlist-sub">Click a playlist to view slides</div>
        </div>
        <div class="hdr-sep"></div>
        <button id="add-slide-btn" onclick="addSlide()">+ Add Slide</button>
      </div>
      <div id="slide-grid">
        <div id="empty-state">
          <div class="big">🎬</div>
          <p>Select a playlist from the sidebar</p>
        </div>
      </div>
    </div>

    <!-- RIGHT: Monitors + Props -->
    <div id="rightpanel">

      <!-- Monitors -->
      <div id="monitors">
        <div class="monitor-box">
          <div class="monitor-label lbl-live">⬤ Live Output</div>
          <div class="monitor-screen live-border" id="live-monitor">
            <div class="slide-canvas" id="live-canvas">
              <div class="slide-text" id="live-text" style="font-size:12px;opacity:.3">No output</div>
            </div>
          </div>
        </div>
        <div class="monitor-box">
          <div class="monitor-label lbl-next">▷ Selected</div>
          <div class="monitor-screen" id="next-monitor">
            <div class="slide-canvas" id="next-canvas">
              <div class="slide-text" id="next-text" style="font-size:12px;opacity:.2">Nothing selected</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Go / Clear -->
      <button id="go-btn" onclick="goLive()">GO LIVE →</button>
      <button id="clear-btn" onclick="clearOutput()">Clear Output (Black)</button>

      <!-- Tabs -->
      <div class="rtabs">
        <div class="rtab active" onclick="switchTab('slide')">Slide</div>
        <div class="rtab" onclick="switchTab('theme')">Theme</div>
        <div class="rtab" onclick="switchTab('output')">Output</div>
      </div>

      <!-- Slide Props Tab -->
      <div class="tab-body active" id="tab-slide">
        <div id="props-area">
          <div class="prop-group">
            <div class="prop-group-title">Content</div>
            <label>Main Text</label>
            <textarea id="prop-text" rows="3" oninput="updateFromProps()" placeholder="Slide text..."></textarea>
            <label style="margin-top:6px">Subtitle</label>
            <input type="text" id="prop-subtext" oninput="updateFromProps()" placeholder="Optional subtitle">
          </div>
          <div class="prop-group">
            <div class="prop-group-title">Typography</div>
            <label>Font Size</label>
            <div class="range-row">
              <input type="range" id="prop-size" min="20" max="120" value="64" oninput="updateFromProps(); document.getElementById('size-val').textContent=this.value+'px'">
              <span class="range-val" id="size-val">64px</span>
            </div>
            <label style="margin-top:6px">Text Color</label>
            <div class="color-row">
              <div class="color-swatch active" style="background:#ffffff" data-color="#ffffff" onclick="pickColor(this)"></div>
              <div class="color-swatch" style="background:#f0e68c" data-color="#f0e68c" onclick="pickColor(this)"></div>
              <div class="color-swatch" style="background:#87ceeb" data-color="#87ceeb" onclick="pickColor(this)"></div>
              <div class="color-swatch" style="background:#98fb98" data-color="#98fb98" onclick="pickColor(this)"></div>
              <div class="color-swatch" style="background:#ffb6c1" data-color="#ffb6c1" onclick="pickColor(this)"></div>
              <div class="color-swatch" style="background:#ffa07a" data-color="#ffa07a" onclick="pickColor(this)"></div>
              <input type="color" id="custom-color" value="#ffffff" style="width:20px;height:20px;padding:0;border:none;background:none;cursor:pointer;border-radius:4px;" oninput="pickColorHex(this.value)">
            </div>
          </div>
          <div class="prop-group">
            <div class="prop-group-title">Background</div>
            <select id="prop-bg" onchange="updateFromProps()">
              <option value="solid-black">Solid Black</option>
              <option value="solid-dark">Solid Dark</option>
              <option value="gradient-dark">Gradient Dark</option>
              <option value="gradient-blue">Gradient Blue</option>
              <option value="gradient-purple">Gradient Purple</option>
              <option value="gradient-warm">Gradient Warm</option>
              <option value="solid-white">Solid White</option>
            </select>
          </div>
          <div class="prop-group">
            <div class="prop-group-title">Transition</div>
            <select id="prop-transition">
              <option value="cut">Cut</option>
              <option value="fade">Fade</option>
              <option value="slide-up">Slide Up</option>
              <option value="zoom">Zoom</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Theme Tab -->
      <div class="tab-body" id="tab-theme">
        <div class="theme-list" id="theme-list"></div>
      </div>

      <!-- Output Tab -->
      <div class="tab-body" id="tab-output">
        <div class="out-section">
          <label>Target Display</label>
          <div id="display-list"></div>
          <button class="tbtn primary" style="width:100%;margin-top:6px" onclick="launchOutput()">Launch Output</button>
          <button class="tbtn danger" style="width:100%;margin-top:4px" onclick="stopOutput()">Close Output</button>
        </div>
        <div class="out-section">
          <label>Transition Speed</label>
          <div class="range-row">
            <input type="range" min="100" max="2000" value="400" id="trans-speed" oninput="document.getElementById('trans-val').textContent=this.value+'ms'">
            <span class="range-val" id="trans-val">400ms</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const { ipcRenderer } = require('electron');

// ─── Data ─────────────────────────────────────────────────────
let playlists = [];
let activePlaylistId = null;
let selectedSlideId = null;
let liveSlide = null;
let outputActive = false;
let currentColor = '#ffffff';
let currentTheme = null;

const THEMES = [
  { id:'default',  name:'Minimal Black',  bg:'solid-black',    textColor:'#ffffff' },
  { id:'church',   name:'Worship Blue',   bg:'gradient-blue',  textColor:'#ffffff' },
  { id:'warm',     name:'Warm Amber',     bg:'gradient-warm',  textColor:'#fff8e7' },
  { id:'purple',   name:'Deep Purple',    bg:'gradient-purple',textColor:'#f0e8ff' },
  { id:'white',    name:'Light / White',  bg:'solid-white',    textColor:'#111111' },
];

// ─── Init ─────────────────────────────────────────────────────
function init() {
  playlists = defaultPlaylists();
  renderPlaylists();
  renderThemes();
  loadDisplays();
  // Auto-select first playlist
  if (playlists.length) selectPlaylist(playlists[0].id);
}

function uid() { return Math.random().toString(36).slice(2,10); }

function defaultPlaylists() {
  return [
    {
      id: uid(), name: 'Opening', color: '#5b8dee',
      slides: [
        { id:uid(), text:'Welcome', subtext:'', bg:'gradient-blue', textColor:'#ffffff', size:72 },
        { id:uid(), text:'Please be seated', subtext:'Service begins soon', bg:'gradient-blue', textColor:'#ffffff', size:52 },
      ]
    },
    {
      id: uid(), name: 'Song — Amazing Grace', color: '#8b5cf6',
      slides: [
        { id:uid(), text:'Amazing Grace', subtext:'Verse 1', bg:'gradient-purple', textColor:'#f0e8ff', size:80 },
        { id:uid(), text:'How sweet the sound\nThat saved a wretch like me', subtext:'Verse 1', bg:'gradient-purple', textColor:'#f0e8ff', size:52 },
        { id:uid(), text:'I once was lost\nBut now am found', subtext:'Verse 1', bg:'gradient-purple', textColor:'#f0e8ff', size:56 },
        { id:uid(), text:'Was blind but now I see', subtext:'Verse 1', bg:'gradient-purple', textColor:'#f0e8ff', size:64 },
        { id:uid(), text:'Chorus', subtext:'', bg:'gradient-purple', textColor:'#c4a0ff', size:72 },
      ]
    },
    {
      id: uid(), name: 'Scripture', color: '#22d3a0',
      slides: [
        { id:uid(), text:'"For God so loved the world..."', subtext:'John 3:16', bg:'solid-dark', textColor:'#e8f8ef', size:52 },
        { id:uid(), text:'"...that he gave his one and only Son"', subtext:'John 3:16', bg:'solid-dark', textColor:'#e8f8ef', size:48 },
      ]
    },
    {
      id: uid(), name: 'Announcements', color: '#fbbf24',
      slides: [
        { id:uid(), text:'Coffee Hour', subtext:'After service in Fellowship Hall', bg:'gradient-warm', textColor:'#fff8e7', size:64 },
        { id:uid(), text:'Youth Group\nFriday at 7 PM', subtext:'All teens welcome', bg:'gradient-warm', textColor:'#fff8e7', size:60 },
        { id:uid(), text:'Give Online', subtext:'app.church/give', bg:'gradient-warm', textColor:'#fff8e7', size:64 },
      ]
    },
    {
      id: uid(), name: 'Closing', color: '#f87171',
      slides: [
        { id:uid(), text:'Thank You', subtext:'See you next week', bg:'gradient-dark', textColor:'#ffffff', size:80 },
      ]
    },
  ];
}

// ─── Playlist Sidebar ─────────────────────────────────────────
function renderPlaylists() {
  const el = document.getElementById('playlist-list');
  el.innerHTML = playlists.map(pl => {
    const hasLive = liveSlide && pl.slides.some(s => s.id === liveSlide.id);
    return `<div class="pl-item ${pl.id===activePlaylistId?'active':''} ${hasLive?'has-live':''}" onclick="selectPlaylist('${pl.id}')">
      <div class="pl-dot" style="background:${pl.color}"></div>
      <div class="pl-info">
        <div class="pl-name">${esc(pl.name)}</div>
        <div class="pl-count">${pl.slides.length} slide${pl.slides.length!==1?'s':''}</div>
      </div>
      <div class="pl-live-pip"></div>
    </div>`;
  }).join('');
}

function selectPlaylist(id) {
  activePlaylistId = id;
  renderPlaylists();
  renderSlideGrid();
  const pl = getPlaylist(id);
  if (pl) {
    document.getElementById('active-playlist-name').textContent = pl.name;
    document.getElementById('active-playlist-sub').textContent = `${pl.slides.length} slides · double-click to go live`;
  }
}

function addPlaylist() {
  const name = prompt('Playlist name:');
  if (!name) return;
  const colors = ['#5b8dee','#8b5cf6','#22d3a0','#fbbf24','#f87171','#f472b6','#34d399'];
  const pl = { id:uid(), name, color:colors[playlists.length % colors.length], slides:[
    { id:uid(), text:'New Slide', subtext:'', bg:'solid-black', textColor:'#ffffff', size:64 }
  ]};
  playlists.push(pl);
  selectPlaylist(pl.id);
}

// ─── Slide Grid ───────────────────────────────────────────────
function renderSlideGrid() {
  const grid = document.getElementById('slide-grid');
  const pl = getPlaylist(activePlaylistId);
  if (!pl) {
    grid.innerHTML = '<div id="empty-state"><div class="big">🎬</div><p>Select a playlist from the sidebar</p></div>';
    return;
  }
  if (!pl.slides.length) {
    grid.innerHTML = '<div id="empty-state"><div class="big">➕</div><p>No slides yet — click + Add Slide</p></div>';
    return;
  }
  grid.innerHTML = pl.slides.map((s, i) => {
    const isLive = liveSlide && liveSlide.id === s.id;
    const isSel = selectedSlideId === s.id;
    return `<div class="slide-card ${isLive?'live':''} ${isSel&&!isLive?'selected':''}"
        onclick="selectSlide('${s.id}')"
        ondblclick="selectSlideAndGo('${s.id}')">
      <div class="slide-card-screen">${miniSvg(s)}</div>
      <div class="slide-card-footer">
        <span class="slide-card-num">${i+1}</span>
        <span class="slide-card-label">${esc(s.text.split('\n')[0] || '(empty)')}</span>
        ${isLive ? '<span class="live-tag">LIVE</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function miniSvg(s) {
  const bg = bgFill(s.bg);
  const lines = (s.text||'').split('\n').slice(0,3);
  const fs = Math.min(9, Math.max(5, 72/(lines[0]?.length||1)*1.5));
  const lineH = fs * 1.3;
  const totalH = lines.length * lineH;
  const startY = (36 - totalH) / 2 + fs;
  return `<svg width="100%" viewBox="0 0 160 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <rect width="160" height="90" fill="${bg}"/>
    ${lines.map((l,i)=>`<text x="80" y="${startY+i*lineH}" text-anchor="middle" fill="${esc(s.textColor||'#fff')}" font-size="${fs}" font-family="sans-serif" font-weight="700">${esc(l.slice(0,22))}</text>`).join('')}
  </svg>`;
}

function bgFill(bg) {
  const map = { 'solid-black':'#000','solid-dark':'#0d1020','solid-white':'#fff','gradient-dark':'#161c30','gradient-blue':'#0a1a3a','gradient-purple':'#1a0a3a','gradient-warm':'#2a1200' };
  return map[bg] || '#000';
}

function bgCss(bg) {
  const map = {
    'solid-black':'#000000','solid-dark':'#0d1020','solid-white':'#ffffff',
    'gradient-dark':'linear-gradient(135deg,#0f1117 0%,#1e2440 100%)',
    'gradient-blue':'linear-gradient(135deg,#0a1a3a 0%,#1e3a6e 100%)',
    'gradient-purple':'linear-gradient(135deg,#1a0a3a 0%,#3a1a6e 100%)',
    'gradient-warm':'linear-gradient(135deg,#2a1200 0%,#6e3a00 100%)',
  };
  return map[bg] || '#000';
}

// ─── Slide Selection ──────────────────────────────────────────
function selectSlide(id) {
  selectedSlideId = id;
  const s = findSlide(id);
  if (!s) return;
  // Load into props
  document.getElementById('prop-text').value = s.text || '';
  document.getElementById('prop-subtext').value = s.subtext || '';
  document.getElementById('prop-size').value = s.size || 64;
  document.getElementById('size-val').textContent = (s.size||64)+'px';
  document.getElementById('prop-bg').value = s.bg || 'solid-black';
  currentColor = s.textColor || '#ffffff';
  document.querySelectorAll('.color-swatch').forEach(sw => sw.classList.toggle('active', sw.dataset.color === currentColor));
  updateNextPreview(s);
  renderSlideGrid();
  renderPlaylists();
}

function selectSlideAndGo(id) {
  selectSlide(id);
  goLive();
}

function getPlaylist(id) { return playlists.find(p => p.id === id); }
function findSlide(id) {
  for (const pl of playlists) { const s = pl.slides.find(s=>s.id===id); if(s) return s; }
}
function getActivePlaylist() { return getPlaylist(activePlaylistId); }

// ─── Add Slide ────────────────────────────────────────────────
function addSlide() {
  const pl = getActivePlaylist();
  if (!pl) return alert('Select a playlist first.');
  const s = { id:uid(), text:'New Slide', subtext:'', bg: pl.slides[0]?.bg || 'solid-black', textColor: pl.slides[0]?.textColor || '#ffffff', size:64 };
  pl.slides.push(s);
  renderSlideGrid();
  renderPlaylists();
  selectSlide(s.id);
}

// ─── Previews ─────────────────────────────────────────────────
function updateNextPreview(s) {
  const canvas = document.getElementById('next-canvas');
  const el = document.getElementById('next-text');
  canvas.style.background = bgCss(s.bg);
  el.textContent = s.text || '';
  el.style.color = s.textColor || '#fff';
  el.style.fontSize = previewFontSize(s.text, s.size||64, canvas) + 'px';
  el.style.opacity = 1;
}

function previewFontSize(text, base, container) {
  const w = container.offsetWidth || 200;
  const longest = (text||'').split('\n').reduce((a,b)=>a.length>b.length?a:b,'');
  const scale = Math.min(1, (w * 0.84) / Math.max(1, longest.length * base * 0.6));
  return Math.round(base * scale * 0.28);
}

function updateFromProps() {
  const data = propsToSlide();
  if (selectedSlideId) {
    const s = findSlide(selectedSlideId);
    if (s) Object.assign(s, data);
  }
  const s = findSlide(selectedSlideId);
  if (s) updateNextPreview(s);
  renderSlideGrid();
}

function propsToSlide() {
  return {
    text: document.getElementById('prop-text').value,
    subtext: document.getElementById('prop-subtext').value,
    size: parseInt(document.getElementById('prop-size').value),
    bg: document.getElementById('prop-bg').value,
    textColor: currentColor,
    transition: document.getElementById('prop-transition').value,
  };
}

// ─── Go Live ──────────────────────────────────────────────────
function goLive() {
  const s = selectedSlideId ? findSlide(selectedSlideId) : null;
  if (!s) return;
  liveSlide = s;
  const canvas = document.getElementById('live-canvas');
  const el = document.getElementById('live-text');
  canvas.style.background = bgCss(s.bg);
  el.textContent = s.text || '';
  el.style.color = s.textColor || '#fff';
  el.style.fontSize = previewFontSize(s.text, s.size||64, canvas) + 'px';
  el.style.opacity = 1;
  const speed = parseInt(document.getElementById('trans-speed').value) || 400;
  ipcRenderer.send('show-slide', { ...s, transitionSpeed: speed });
  renderSlideGrid();
  renderPlaylists();
}

function clearOutput() {
  liveSlide = null;
  const canvas = document.getElementById('live-canvas');
  const el = document.getElementById('live-text');
  canvas.style.background = '#000';
  el.textContent = 'No output';
  el.style.opacity = 0.3;
  ipcRenderer.send('clear-output');
  renderSlideGrid();
  renderPlaylists();
}

// ─── Output window ────────────────────────────────────────────
function launchOutput() {
  ipcRenderer.send('open-output-window', null);
  outputActive = true;
  document.getElementById('live-badge').classList.add('active');
  document.getElementById('live-status').textContent = 'LIVE';
  document.getElementById('launch-btn').style.display = 'none';
  document.getElementById('stop-btn').style.display = '';
}
function stopOutput() {
  ipcRenderer.send('close-output-window');
  outputActive = false;
  document.getElementById('live-badge').classList.remove('active');
  document.getElementById('live-status').textContent = 'OUTPUT OFF';
  document.getElementById('launch-btn').style.display = '';
  document.getElementById('stop-btn').style.display = 'none';
}
async function loadDisplays() {
  const displays = await ipcRenderer.invoke('get-displays');
  const list = document.getElementById('display-list');
  list.innerHTML = displays.map((d,i)=>`<button class="disp-btn ${i===0?'selected':''}" onclick="pickDisplay(this,${d.id})">${d.label}${d.primary?' ★':''}</button>`).join('');
}
function pickDisplay(el, id) {
  document.querySelectorAll('.disp-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  if (outputActive) ipcRenderer.send('open-output-window', id);
}

// ─── Themes ───────────────────────────────────────────────────
function renderThemes() {
  document.getElementById('theme-list').innerHTML = THEMES.map(t=>`
    <div class="theme-item ${currentTheme===t.id?'active':''}" onclick="applyTheme('${t.id}')">
      <div class="theme-swatch" style="background:${bgFill(t.bg)}"></div>
      <div class="theme-name">${t.name}</div>
    </div>`).join('');
}
function applyTheme(id) {
  const t = THEMES.find(x=>x.id===id); if(!t) return;
  currentTheme = id;
  document.getElementById('prop-bg').value = t.bg;
  currentColor = t.textColor;
  document.querySelectorAll('.color-swatch').forEach(sw=>sw.classList.remove('active'));
  updateFromProps();
  renderThemes();
}

// ─── Color ────────────────────────────────────────────────────
function pickColor(el) {
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  currentColor = el.dataset.color;
  updateFromProps();
}
function pickColorHex(hex) {
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
  currentColor = hex;
  updateFromProps();
}

// ─── Tabs ─────────────────────────────────────────────────────
function switchTab(name) {
  const names = ['slide','theme','output'];
  document.querySelectorAll('.rtab').forEach((t,i)=>t.classList.toggle('active',names[i]===name));
  document.querySelectorAll('.tab-body').forEach(tb=>tb.classList.toggle('active',tb.id==='tab-'+name));
}

// ─── Keyboard ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if (e.key==='Enter'||e.key===' ') { e.preventDefault(); goLive(); }
  if (e.key==='Escape') clearOutput();
  if (e.key==='ArrowRight'||e.key==='ArrowDown') { e.preventDefault(); nudgeSlide(1); }
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') { e.preventDefault(); nudgeSlide(-1); }
});

function nudgeSlide(dir) {
  const pl = getActivePlaylist(); if(!pl) return;
  const idx = pl.slides.findIndex(s=>s.id===selectedSlideId);
  const next = pl.slides[idx+dir];
  if (next) { selectSlide(next.id); goLive(); }
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
</script>
