<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Timecode Pro</title>
<style>:root{--bg:#0a0b0e;--surf:#111318;--surf2:#181b22;--border:#1e2530;--amber:#e8a020;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--text:#f0f2f7;--muted:#6b7280}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'SF Mono',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0}.logo{font-weight:800;font-size:15px}.tc-clock{font-size:28px;font-weight:700;color:var(--amber);letter-spacing:.06em;font-variant-numeric:tabular-nums}.transport{display:flex;gap:8px;align-items:center}.layout{flex:1;display:flex;overflow:hidden}.cue-list{width:340px;border-right:1px solid var(--border);display:flex;flex-direction:column}.cue-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.cues{flex:1;overflow-y:auto}.cue-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}.cue-row:hover{background:var(--surf2)}.cue-row.active{background:rgba(232,160,32,.1);border-left:3px solid var(--amber)}.cue-row.fired{background:rgba(34,197,94,.06)}.cue-tc{font-size:12px;color:var(--amber);width:90px;flex-shrink:0;font-variant-numeric:tabular-nums}.cue-type{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;flex-shrink:0}.ct-osc{background:rgba(59,130,246,.15);color:var(--blue)}.ct-midi{background:rgba(168,85,247,.15);color:#a855f7}.ct-audio{background:rgba(34,197,94,.15);color:var(--green)}.ct-video{background:rgba(239,68,68,.15);color:var(--red)}.ct-wait{background:rgba(107,114,128,.15);color:var(--muted)}.cue-label{flex:1;font-size:12px}.right{flex:1;display:flex;flex-direction:column;overflow:hidden}.inspector{flex:1;padding:16px;overflow-y:auto}.card{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}.ct{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}.btn{padding:8px 16px;border-radius:5px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:'SF Mono',monospace}.bg{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green)}.br{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}.ba{background:var(--amber);color:#000}.bs{background:var(--surf2);border:1px solid var(--border);color:var(--muted)}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.url{font-size:11px;color:var(--amber);padding:7px 10px;background:var(--surf2);border-radius:5px;word-break:break-all}</style></head><body>
<header>
  <div class="logo">⏱ Timecode Pro</div>
  <div class="tc-clock" id="clock">00:00:00:00</div>
  <div class="transport">
    <button class="btn bg" onclick="play()">▶ Play</button>
    <button class="btn br" onclick="stop()">■ Stop</button>
    <button class="btn bs" onclick="gotoStart()">⏮</button>
    <button class="btn ba" onclick="goNext()">GO ▶</button>
  </div>
</header>
<div class="layout">
  <div class="cue-list">
    <div class="cue-header"><span>Cue</span><span>Label</span><span>Type</span></div>
    <div class="cues" id="cues"></div>
  </div>
  <div class="right">
    <div class="inspector">
      <div class="card">
        <div class="ct">Transport</div>
        <div class="g3">
          <button class="btn bg" style="font-size:18px;font-weight:900;padding:14px" onclick="go()">GO</button>
          <button class="btn br" onclick="stop()">STOP</button>
          <button class="btn bs" onclick="gotoStart()">RESET</button>
        </div>
      </div>
      <div class="card">
        <div class="ct">Current Cue</div>
        <div id="cur-cue-info" style="font-size:12px;color:var(--muted)">No cue selected</div>
      </div>
      <div class="card">
        <div class="ct">Mobile Remote</div>
        <div class="url" id="srv-url">Loading...</div>
      </div>
    </div>
  </div>
</div>
<script>
const cues = [
  {tc:'00:00:00:00', type:'osc',   label:'Show Start — EOS Cue 1 Go'},
  {tc:'00:00:05:00', type:'audio', label:'Intro Music Fade In'},
  {tc:'00:00:30:00', type:'osc',   label:'Lights — Verse Look'},
  {tc:'00:01:00:00', type:'midi',  label:'MIDI Note C4 — Drum Trigger'},
  {tc:'00:01:30:00', type:'osc',   label:'Chorus Lighting — Cue 3'},
  {tc:'00:02:00:00', type:'video', label:'Lyric Video Start'},
  {tc:'00:03:00:00', type:'osc',   label:'Bridge — Cue 5'},
  {tc:'00:04:00:00', type:'audio', label:'Background Music Out'},
  {tc:'00:04:30:00', type:'osc',   label:'Message Lighting — Cue 10'},
  {tc:'00:10:00:00', type:'wait',  label:'Hold — Manual GO'},
  {tc:'00:10:05:00', type:'osc',   label:'Offering — Cue 15'},
  {tc:'00:12:00:00', type:'osc',   label:'Closing — Cue 20'},
];

let curCue=0, playing=false, frames=0;
let timer=null;

const typeClass={osc:'ct-osc',midi:'ct-midi',audio:'ct-audio',video:'ct-video',wait:'ct-wait'};
const cueEl=document.getElementById('cues');
cues.forEach((c,i)=>{
  const row=document.createElement('div'); row.className='cue-row'+(i===0?' active':'');
  row.id='cue-'+i;
  row.innerHTML=`<span class="cue-tc">${c.tc}</span><span class="cue-label">${c.label}</span><span class="cue-type ${typeClass[c.type]||''}">${c.type.toUpperCase()}</span>`;
  row.onclick=()=>{
    curCue=i;
    document.querySelectorAll('.cue-row').forEach((r,j)=>r.classList.toggle('active',j===i));
    document.getElementById('cur-cue-info').innerHTML=`<strong>${c.label}</strong><br><span style="color:var(--muted)">${c.type.toUpperCase()} @ ${c.tc}</span>`;
  };
  cueEl.appendChild(row);
});

function updateClock() {
  const h=Math.floor(frames/108000), m=Math.floor((frames%108000)/1800), s=Math.floor((frames%1800)/30), f=frames%30;
  document.getElementById('clock').textContent=[h,m,s,f].map(n=>String(n).padStart(2,'0')).join(':');
}

function play() { if(playing)return; playing=true; timer=setInterval(()=>{ frames++; updateClock(); fireCues(); },33); }
function stop() { playing=false; clearInterval(timer); }
function gotoStart() { stop(); frames=0; updateClock(); }

function tcToFrames(tc) {
  const p=tc.split(':').map(Number); return p[0]*108000+p[1]*1800+p[2]*30+p[3];
}

function fireCues() {
  cues.forEach((c,i)=>{
    if(tcToFrames(c.tc)===frames) {
      document.getElementById('cue-'+i).classList.add('fired');
      window.tc?.send({type:'osc',ip:'192.168.1.100',port:3032,address:'/eos/cue/'+(i+1)+'/fire',args:[]});
    }
  });
}

function go() { if(!playing)play(); else { frames=tcToFrames(cues[Math.min(curCue+1,cues.length-1)].tc); } }
function goNext() { curCue=Math.min(curCue+1,cues.length-1); document.getElementById('cue-'+curCue)?.click(); }

window.tc?.getServerUrl().then(u=>{ document.getElementById('srv-url').textContent=u; });
window.tc?.onServerUrl(u=>{ document.getElementById('srv-url').textContent=u; });
</script>
</body></html>
