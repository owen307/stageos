<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Timecode Pro — Video Output</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw; height: 100vh;
      background: #000;
      overflow: hidden;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      cursor: none;
    }

    #videoEl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* Idle / standby screen */
    #idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      gap: 12px;
      z-index: 5;
      transition: opacity 0.5s;
    }
    #idle.hidden { opacity: 0; pointer-events: none; }
    #idleLogo  { font-size: 11px; color: rgba(0,229,255,0.25); letter-spacing: 0.2em; text-transform: uppercase; }
    #idleClock { font-size: 11px; color: rgba(255,255,255,0.08); letter-spacing: 0.15em; }

    /* Blackout overlay */
    #blackout {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #blackout.on { opacity: 1; }

    /* Subtle corner timecode — barely visible */
    #cornerTc {
      position: absolute;
      bottom: 6px; right: 8px;
      font-size: 9px;
      color: rgba(255,255,255,0.07);
      letter-spacing: 0.1em;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    /* Error display */
    #errorMsg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ff3a5c;
      font-size: 12px;
      text-align: center;
      z-index: 30;
      display: none;
      padding: 12px 20px;
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,58,92,0.4);
      border-radius: 8px;
      max-width: 80%;
    }
  </style>
</head>
<body>

  <video id="videoEl" playsinline></video>

  <div id="idle">
    <img src="../assets/logo.png" style="width:72px;height:72px;object-fit:contain;opacity:0.3;border-radius:8px;" alt="" />
    <div id="idleLogo">Timecode Pro — Video Output</div>
    <div id="idleClock">00:00:00:00</div>
  </div>

  <div id="blackout"></div>
  <div id="cornerTc">00:00:00:00</div>
  <div id="errorMsg"></div>

  <script>
  (() => {
    const api    = window.videoAPI;
    const video  = document.getElementById('videoEl');
    const idle   = document.getElementById('idle');
    const idleClock = document.getElementById('idleClock');
    const blackout  = document.getElementById('blackout');
    const cornerTc  = document.getElementById('cornerTc');
    const errorMsg  = document.getElementById('errorMsg');

    let blackedOut = false;

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      console.error('Video error:', msg);
      setTimeout(() => { errorMsg.style.display = 'none'; }, 6000);
    }

    function toggleBlackout(force) {
      blackedOut = (force !== undefined) ? !!force : !blackedOut;
      blackout.classList.toggle('on', blackedOut);
    }

    function loadAndPlay(cue) {
      errorMsg.style.display = 'none';
      video.volume = (cue.volume !== undefined) ? Math.min(1, Math.max(0, cue.volume)) : 1;
      video.loop   = !!cue.loop;
      video.style.objectFit = cue.fit || 'contain';
      video.src = cue.fileUrl;
      video.load();
      video.play().then(() => {
        idle.classList.add('hidden');
        if (blackedOut) toggleBlackout(false);
        console.log('Playing:', cue.fileUrl);
      }).catch(err => {
        showError('Playback failed: ' + err.message);
      });
    }

    video.addEventListener('ended', () => {
      if (!video.loop) {
        setTimeout(() => { idle.classList.remove('hidden'); }, 600);
      }
    });

    video.addEventListener('error', () => {
      const e = video.error;
      showError(e ? `Error ${e.code}: ${e.message}` : 'Unknown video error');
    });

    // Only keyboard shortcuts — no visible controls
    document.addEventListener('keydown', e => {
      switch (e.code) {
        case 'Space':      e.preventDefault(); video.paused ? video.play() : video.pause(); break;
        case 'ArrowLeft':  video.currentTime = Math.max(0, video.currentTime - 5); break;
        case 'ArrowRight': video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); break;
        case 'KeyB':       toggleBlackout(); break;
        case 'KeyF':
          if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
          else document.exitFullscreen();
          break;
        case 'KeyM': video.muted = !video.muted; break;
      }
    });

    // IPC commands from main control window
    if (api) {
      api.onCommand(cmd => {
        switch (cmd.type) {
          case 'load-and-play': loadAndPlay(cmd.cue); break;
          case 'pause':    video.pause(); break;
          case 'resume':   video.play().catch(() => {}); break;
          case 'stop':
            video.pause(); video.currentTime = 0; video.src = '';
            idle.classList.remove('hidden');
            break;
          case 'seek':     if (video.duration) video.currentTime = cmd.time || 0; break;
          case 'volume':   video.volume = Math.min(1, Math.max(0, cmd.value ?? 1)); break;
          case 'loop':     video.loop = !!cmd.value; break;
          case 'blackout': toggleBlackout(cmd.value); break;
          case 'fit':      video.style.objectFit = cmd.value || 'contain'; break;
          case 'tc-tick':
            const tc = cmd.tc || '00:00:00:00';
            cornerTc.textContent = tc;
            idleClock.textContent = tc;
            break;
        }
      });
    }
  })();
  </script>
</body>
</html>
