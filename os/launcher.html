<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StageOS</title>
<style>
  :root {
    --bg:        #0a0b0e;
    --surface:   #111318;
    --surface2:  #181b22;
    --border:    #252830;
    --accent:    #e8a020;
    --accent2:   #3b82f6;
    --green:     #22c55e;
    --red:       #ef4444;
    --amber:     #f59e0b;
    --text:      #f0f2f7;
    --muted:     #6b7280;
    --font:      'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }

  /* ── Top Bar ── */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 52px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark {
    width: 32px; height: 32px; background: var(--accent);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 16px; color: #000; letter-spacing: -1px;
  }
  .logo-text { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .logo-sub  { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }

  #devices { display: flex; gap: 8px; }
  .dev-pill {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface2);
    font-size: 11px; font-weight: 500; cursor: pointer; transition: all .2s;
  }
  .dev-pill:hover { border-color: var(--accent); }
  .dev-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dev-pill.connected .dev-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dev-pill.error .dev-dot { background: var(--red); }

  #clock { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* ── Output Monitor Bar ── */
  #output-bar {
    position: fixed; top: 52px; left: 0; right: 0;
    background: var(--surface2); border-bottom: 1px solid var(--border);
    padding: 8px 24px; display: flex; gap: 10px; align-items: center; z-index: 99;
  }
  .out-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-right: 4px; }
  .display-card {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); font-size: 11px; cursor: pointer; transition: all .2s;
    min-width: 120px;
  }
  .display-card:hover { border-color: var(--accent2); }
  .display-card.active { border-color: var(--green); }
  .display-icon { font-size: 14px; }
  .display-info { display: flex; flex-direction: column; }
  .display-role { font-weight: 600; font-size: 11px; }
  .display-res  { font-size: 9px; color: var(--muted); }
  .display-card .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-left: auto; }
  .display-card.active .status-dot { background: var(--green); }

  /* ── Main Content ── */
  #main { position: absolute; top: 108px; left: 0; right: 0; bottom: 0; display: flex; }

  #app-grid {
    flex: 1; padding: 24px; display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 16px; overflow: hidden;
  }

  .app-tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px;
    display: flex; flex-direction: column; cursor: pointer;
    transition: all .2s; position: relative; overflow: hidden;
  }
  .app-tile::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--tile-color, var(--accent));
  }
  .app-tile:hover { border-color: var(--tile-color, var(--accent)); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .app-tile:active { transform: translateY(0); }
  .app-tile.running { border-color: var(--tile-color, var(--accent)); }
  .app-tile.running::after {
    content: 'RUNNING'; position: absolute; top: 14px; right: 14px;
    font-size: 9px; font-weight: 700; letter-spacing: .1em;
    color: var(--tile-color, var(--accent)); background: rgba(0,0,0,.6);
    padding: 2px 6px; border-radius: 4px; border: 1px solid var(--tile-color, var(--accent));
  }
  .app-icon { font-size: 36px; margin-bottom: 12px; }
  .app-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .app-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .app-tags { display: flex; gap: 4px; margin-top: auto; padding-top: 12px; flex-wrap: wrap; }
  .tag {
    font-size: 9px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,.06); color: var(--muted);
  }

  /* ── Right Panel ── */
  #right-panel {
    width: 280px; background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .panel-section { padding: 16px; border-bottom: 1px solid var(--border); }
  .panel-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 12px; }

  .level-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .level-label { font-size: 11px; width: 70px; flex-shrink: 0; }
  .level-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .level-fill { height: 100%; border-radius: 3px; transition: width .05s; }
  .level-val { font-size: 10px; color: var(--muted); width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

  .universe-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; border-radius: 6px; background: var(--surface2);
    margin-bottom: 6px; font-size: 11px;
  }
  .universe-num { font-weight: 700; color: var(--accent); }
  .universe-proto { color: var(--muted); font-size: 10px; }
  .universe-activity { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .universe-activity.active { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .stream-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px; background: var(--surface2); margin-bottom: 6px;
  }
  .stream-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .stream-dot.live { background: var(--red); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .stream-info { flex: 1; }
  .stream-name { font-size: 11px; font-weight: 600; }
  .stream-url  { font-size: 9px; color: var(--muted); }

  .quick-btn {
    width: 100%; padding: 8px 12px; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 11px; font-weight: 600;
    cursor: pointer; text-align: left; transition: all .15s;
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .quick-btn:hover { background: var(--border); }
  .quick-btn.danger:hover { background: rgba(239,68,68,.15); border-color: var(--red); color: var(--red); }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 20px; font-size: 13px; font-weight: 500;
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9999;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">
    <div class="logo-mark">S</div>
    <div>
      <div class="logo-text">StageOS</div>
      <div class="logo-sub">Production Operating System</div>
    </div>
  </div>
  <div id="devices">
    <div class="dev-pill" id="pill-eos" title="ETC EOS"><span class="dev-dot"></span>EOS</div>
    <div class="dev-pill" id="pill-m32" title="Behringer M32"><span class="dev-dot"></span>M32</div>
    <div class="dev-pill" id="pill-atem" title="ATEM Switcher"><span class="dev-dot"></span>ATEM</div>
    <div class="dev-pill" id="pill-pp" title="ProPresenter"><span class="dev-dot"></span>ProPres</div>
    <div class="dev-pill" id="pill-ola" title="OLA DMX Daemon"><span class="dev-dot"></span>OLA</div>
    <div class="dev-pill" id="pill-jack" title="JACK Audio"><span class="dev-dot"></span>JACK</div>
  </div>
  <div id="clock">--:--:--</div>
</div>

<div id="output-bar">
  <span class="out-label">Outputs</span>
  <div id="display-list"></div>
</div>

<div id="main">
  <div id="app-grid"></div>
  <div id="right-panel">
    <div class="panel-section">
      <div class="panel-title">DMX Universes</div>
      <div id="dmx-universes">
        <div class="universe-row"><span class="universe-num">U1</span><span>Art-Net / OLA</span><span class="universe-proto">sACN</span><span class="universe-activity" id="u1-dot"></span></div>
        <div class="universe-row"><span class="universe-num">U2</span><span>USB-DMX</span><span class="universe-proto">Enttec</span><span class="universe-activity" id="u2-dot"></span></div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">Audio Output</div>
      <div class="level-row">
        <span class="level-label">FOH L/R</span>
        <div class="level-bar"><div class="level-fill" id="lv-foh" style="width:0%;background:#22c55e"></div></div>
        <span class="level-val" id="lv-foh-val">-∞</span>
      </div>
      <div class="level-row">
        <span class="level-label">IEM Mix</span>
        <div class="level-bar"><div class="level-fill" id="lv-iem" style="width:0%;background:#3b82f6"></div></div>
        <span class="level-val" id="lv-iem-val">-∞</span>
      </div>
      <div class="level-row">
        <span class="level-label">Record</span>
        <div class="level-bar"><div class="level-fill" id="lv-rec" style="width:0%;background:#e8a020"></div></div>
        <span class="level-val" id="lv-rec-val">-∞</span>
      </div>
      <div class="level-row">
        <span class="level-label">Stream</span>
        <div class="level-bar"><div class="level-fill" id="lv-str" style="width:0%;background:#a855f7"></div></div>
        <span class="level-val" id="lv-str-val">-∞</span>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">Streams</div>
      <div id="stream-list">
        <div class="stream-row">
          <div class="stream-dot" id="stream1-dot"></div>
          <div class="stream-info">
            <div class="stream-name">YouTube Live</div>
            <div class="stream-url">rtmp://a.rtmp.youtube.com/live2</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">Quick Actions</div>
      <button class="quick-btn" onclick="daemonCmd({type:'display_extend'})">🖥️ Extend All Displays</button>
      <button class="quick-btn" onclick="daemonCmd({type:'jack_list'})">🔊 Refresh JACK Ports</button>
      <button class="quick-btn" onclick="checkDevices()">🔍 Ping All Devices</button>
      <button class="quick-btn danger" onclick="confirmBlackout()">⚫ Blackout All DMX</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const APPS = [
  { id: 'booth', name: 'Booth', icon: '🎛️', color: '#e8a020',
    desc: 'Unified show control — EOS, M32, ATEM, ProPresenter, Lightkey',
    cmd:  'node /opt/stageos/apps/booth/main.js',
    tags: ['OSC','MIDI','DMX','Audio','Video'] },
  { id: 'lightscript', name: 'LightScript', icon: '💡', color: '#a855f7',
    desc: 'Full lighting control with timecode, cue system, 3D visualizer, GDTF',
    cmd:  'node /opt/stageos/apps/lightscript/main.js',
    tags: ['DMX','Art-Net','sACN','MIDI','Timecode'] },
  { id: 'stageflow', name: 'StageFlow', icon: '📽️', color: '#3b82f6',
    desc: 'ProPresenter-style visual output — lyrics, slides, video, multi-screen',
    cmd:  'node /opt/stageos/apps/stageflow/main.js',
    tags: ['Video','NDI','Multi-Output','Lyrics'] },
  { id: 'timecode-pro', name: 'Timecode Pro', icon: '⏱️', color: '#22c55e',
    desc: 'QLab-alternative show automation, timecode-driven cues and playback',
    cmd:  'node /opt/stageos/apps/timecode-pro/main.js',
    tags: ['LTC','MTC','OSC','Video','Audio'] },
  { id: 'booth-sports', name: 'Booth Sports', icon: '🏟️', color: '#ef4444',
    desc: 'Sports broadcast control — Jumbotrons, scoring, ads, live stream',
    cmd:  'node /opt/stageos/apps/booth-sports/main.js',
    tags: ['Video','Scoring','Stream','Graphics'] },
  { id: 'settings', name: 'Settings', icon: '⚙️', color: '#6b7280',
    desc: 'Network config, device IPs, display assignment, JACK routing, OLA setup',
    cmd:  'SETTINGS',
    tags: ['Network','Displays','DMX','Audio'] }
];

const running = new Set();

function renderApps() {
  const grid = document.getElementById('app-grid');
  grid.innerHTML = APPS.map(app => `
    <div class="app-tile ${running.has(app.id) ? 'running' : ''}"
         style="--tile-color:${app.color}"
         onclick="launchApp('${app.id}')">
      <div class="app-icon">${app.icon}</div>
      <div class="app-name">${app.name}</div>
      <div class="app-desc">${app.desc}</div>
      <div class="app-tags">${app.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function launchApp(id) {
  const app = APPS.find(a => a.id === id);
  if (!app) return;
  if (app.cmd === 'SETTINGS') { showToast('Settings panel — coming soon'); return; }
  if (window.electronAPI) {
    window.electronAPI.launchApp(id, app.cmd);
  } else {
    fetch(`http://localhost:9002/launch?id=${id}&cmd=${encodeURIComponent(app.cmd)}`).catch(()=>{});
  }
  running.add(id);
  renderApps();
  showToast(`Launching ${app.name}…`);
}

let ws;
function connectDaemon() {
  ws = new WebSocket('ws://localhost:9001');
  ws.onopen  = () => { updatePill('ola', true); };
  ws.onclose = () => { updatePill('ola', false); setTimeout(connectDaemon, 3000); };
  ws.onmessage = e => {
    try { handleDaemonMsg(JSON.parse(e.data)); } catch(err) {}
  };
}

function daemonCmd(obj) {
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function handleDaemonMsg(msg) {
  if (msg.type === 'displays') renderDisplays(msg.displays);
  if (msg.type === 'dmx_updated') flashUniverse(msg.universe);
}

const DISPLAY_ICONS = { Operator:'🖥️', Stage:'📺', FOH:'📺', 'Jumbotron 1':'🏟️', 'Jumbotron 2':'🏟️', 'LED Wall':'💡', Confidence:'👁️', Stream:'📡', Recording:'⏺️' };
function renderDisplays(displays) {
  const list = document.getElementById('display-list');
  if (!displays?.length) { list.innerHTML = '<span style="font-size:11px;color:var(--muted)">No displays detected</span>'; return; }
  list.innerHTML = displays.map(d => `
    <div class="display-card ${d.active ? 'active' : ''}" onclick="cycleRole(${d.index})">
      <span class="display-icon">${DISPLAY_ICONS[d.role] || '🖥️'}</span>
      <div class="display-info">
        <span class="display-role">${d.role}</span>
        <span class="display-res">${d.name} · ${d.resolution}</span>
      </div>
      <span class="status-dot"></span>
    </div>
  `).join('');
}

const ROLES = ['Operator','Stage','FOH','Jumbotron 1','Jumbotron 2','LED Wall','Confidence','Stream','Recording'];
function cycleRole(index) {
  const card = document.querySelectorAll('.display-card')[index];
  if (!card) return;
  const cur  = card.querySelector('.display-role').textContent;
  const next = ROLES[(ROLES.indexOf(cur) + 1) % ROLES.length];
  daemonCmd({ type: 'display_assign', index, role: next });
}

const DEVICES = {
  eos:  { ip: '192.168.1.100', port: 3032,  proto: 'tcp' },
  m32:  { ip: '192.168.1.101', port: 10023, proto: 'udp' },
  atem: { ip: '192.168.1.102', port: 9910,  proto: 'tcp' },
  pp:   { ip: '192.168.1.103', port: 50001, proto: 'http' },
  ola:  { ip: '127.0.0.1',     port: 9090,  proto: 'http' },
  jack: { ip: '127.0.0.1',     port: 0,     proto: 'local' }
};

async function checkDevices() {
  for (const [id, cfg] of Object.entries(DEVICES)) {
    if (cfg.proto === 'http') {
      try {
        const r = await fetch(`http://${cfg.ip}:${cfg.port}/`, { signal: AbortSignal.timeout(1000) });
        updatePill(id, r.ok);
      } catch { updatePill(id, false); }
    } else {
      updatePill(id, false);
    }
  }
}

function updatePill(id, online) {
  const pill = document.getElementById(`pill-${id}`);
  if (!pill) return;
  pill.classList.toggle('connected', online);
  pill.classList.toggle('error', !online);
}

function flashUniverse(universe) {
  const dot = document.getElementById(`u${universe}-dot`);
  if (!dot) return;
  dot.classList.add('active');
  setTimeout(() => dot.classList.remove('active'), 100);
}

function updateLevels() {
  const ids = ['foh','iem','rec','str'];
  ids.forEach(id => {
    const fill = document.getElementById(`lv-${id}`);
    const val  = document.getElementById(`lv-${id}-val`);
    if (!fill) return;
    const w = parseFloat(fill.style.width) || 0;
    const newW = Math.max(0, w * 0.92 + (Math.random() > 0.9 ? Math.random() * 30 : 0));
    fill.style.width = newW + '%';
    const db = newW > 0.5 ? (20 * Math.log10(newW / 100)).toFixed(1) : '-∞';
    val.textContent = db + (newW > 0.5 ? ' dB' : '');
    fill.style.background = newW > 85 ? '#ef4444' : newW > 70 ? '#f59e0b' : fill.style.background;
  });
}

function confirmBlackout() {
  if (confirm('Send DMX blackout to all universes?')) {
    for (let u = 1; u <= 4; u++) {
      daemonCmd({ type: 'dmx', universe: u, data: new Array(512).fill(0) });
    }
    showToast('⚫ DMX Blackout sent to all universes');
  }
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

renderApps();
connectDaemon();
checkDevices();

setInterval(updateClock, 1000);
setInterval(updateLevels, 50);
setInterval(checkDevices, 30000);

updateClock();
renderDisplays([
  { name: 'HDMI-1', resolution: '1920x1080', role: 'Operator', active: true, index: 0 },
  { name: 'HDMI-2', resolution: '1920x1080', role: 'Stage',    active: true, index: 1 },
]);

document.addEventListener('keydown', e => {
  if (e.key === 'F11') { showToast('Full screen toggle'); }
  if (e.key === 'Escape' && e.shiftKey) { confirmBlackout(); }
  if (e.key >= '1' && e.key <= '6' && e.ctrlKey) { launchApp(APPS[parseInt(e.key)-1]?.id); }
});
</script>
</body>
</html>
